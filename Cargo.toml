[package]
name = "mos6502"
version = "1000000.0.0"
edition = "2021"
authors = ["Vinícius Fernandes Lustosa"]
description = "MOS 6502 and 65C02 emulator suite: assembler with four-level macros, bus-cycle stepping (official, stable unofficial, CMOS, JAM halt), 6551 ACIA baud nibble plus parity and stop bits, 6522 ports/timers/handshake/PB7/shift, JSON snapshot v2 through v5, debugger PC-range watch, palette and name table, and a VIA IRQ board."
license = "MIT"
readme = "README.md"
repository = "https://github.com/geraliza/01-02-mos6502"
keywords = ["6502", "emulator", "cpu", "apple1", "assembler"]
categories = ["emulators", "command-line-utilities", "hardware-support"]

[[bin]]
name = "mos6502"
path = "src/main.rs"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
